name: Run Hosting Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # ၆ နာရီခြားတစ်ခါ အလိုအလျောက် run ရန်
  workflow_dispatch: # Manual run လုပ်နိုင်ရန်

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-latest
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyTelegramBotAPI psutil requests beautifulsoup4 Pillow opencv-python

    - name: Run Hosting Bot
      run: |
        # Timeout ကို ၆ နာရီ (၂၁၆၀၀ စက္ကန့်) သတ်မှတ်ထားသည်
        timeout 21600s python hosting_bot.py || echo "Workflow reached timeout or stopped."
